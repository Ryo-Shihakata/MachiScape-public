<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1c22" media="(prefers-color-scheme: dark)" />
    <title>MachiScape P0 - Spline</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #f5f3ef;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #1a1c22;
        }
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #toolbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: center;
        gap: 8px;
        padding: 10px calc(10px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom))
          calc(10px + env(safe-area-inset-left));
        z-index: 20;
      }
      .tool-btn {
        font: 14px/1 -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
        padding: 12px 20px;
        border-radius: 999px;
        border: none;
        background: rgba(255, 255, 255, 0.92);
        color: #2b2a27;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
      }
      @media (prefers-color-scheme: dark) {
        .tool-btn {
          background: rgba(30, 32, 39, 0.92);
          color: #e8e5df;
        }
      }
      .tool-btn.active {
        outline: 2px solid #4a90d9;
        outline-offset: -2px;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="toolbar">
      <button class="tool-btn" data-tool="pan" type="button">パン</button>
      <button class="tool-btn" data-tool="road" type="button">道路</button>
      <button class="tool-btn" data-tool="erase" type="button">撤去</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
