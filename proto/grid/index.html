<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1c22" media="(prefers-color-scheme: dark)" />
    <title>MachiScape P0 — グリッド試作</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f5f3ef;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #1a1c22;
        }
      }
      #canvas-host {
        position: absolute;
        inset: 0;
      }
      #toolbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: env(safe-area-inset-bottom, 0px);
        display: flex;
        justify-content: center;
        gap: 8px;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }
      #toolbar button {
        pointer-events: auto;
        font: 14px/1.2 system-ui, -apple-system, 'Hiragino Sans', sans-serif;
        padding: 12px 18px;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        background: rgba(255, 255, 255, 0.92);
        color: #2b2a27;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.16);
      }
      #toolbar button.active {
        background: #4a90d9;
        color: #fff;
        border-color: transparent;
      }
      @media (prefers-color-scheme: dark) {
        #toolbar button {
          background: rgba(30, 32, 39, 0.92);
          color: #e8e5df;
          border-color: rgba(255, 255, 255, 0.12);
        }
        #toolbar button.active {
          background: #6aa9e9;
          color: #10121a;
        }
      }
    </style>
  </head>
  <body>
    <div id="canvas-host"></div>
    <div id="toolbar">
      <button type="button" data-tool="pan">パン</button>
      <button type="button" data-tool="road" class="active">道路</button>
      <button type="button" data-tool="erase">撤去</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
